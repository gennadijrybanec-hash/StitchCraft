name: StitchCraft FREE TEST APK (manual only)

on:
  workflow_dispatch:

jobs:
  free-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build isolated FREE TEST APK
        run: gradle assembleFreeTest
      - name: Upload APK only (never publish to Play)
        uses: actions/upload-artifact@v4
        with:
          name: StitchCraft-v146-FREE-TEST-APK-NOT-FOR-PLAY
          path: app/build/outputs/apk/freeTest/*.apk
          retention-days: 7
